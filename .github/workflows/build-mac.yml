name: Build macOS

on:
  workflow_dispatch: # manual trigger from Actions tab

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12 # 与本地 pnpm 版本对齐（lockfile v9 + allowBuilds 需要新版解析）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同时出 Intel(x64) 与 Apple Silicon(arm64) 两个 DMG  
      - name: Build macOS DMG (x64 + arm64)
        run: pnpm run build:mac -- --publish never --x64 --arm64

      # 真机自检：在 macOS 跑机上启动打包出的应用，截图供人工确认运行效果
      - name: Smoke test (launch app + screenshot)
        run: |
          APP=$(ls -d dist-new/mac-arm64/electron-app.app 2>/dev/null || ls -d dist-new/mac/electron-app.app)
          echo "Launching: $APP"
          open "$APP"
          sleep 20
          screencapture -x app-on-mac.png
          ls -la app-on-mac.png
          pkill -f electron-app || true

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshot
          path: app-on-mac.png
          if-no-files-found: warn

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist-new/*.dmg
          if-no-files-found: error
