<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- CSP：渲染层零网络能力，故 connect-src 只放 dev 的 Vite HMR WebSocket；
         图片放行 B 站图床(hdslb.com)。script-src 严格 'self'，禁内联脚本。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https://*.hdslb.com;
               connect-src 'self' ws://localhost:*;
               font-src 'self' data:;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
